services:

  mysql:
    image: mysql:8.4
    container_name: desafios-fitness-mysql

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: desafios_fitness
      MYSQL_USER: desafios_user
      MYSQL_PASSWORD: desafios123

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  tomcat:
    image: tomcat:10.1-jdk21
    container_name: desafios-fitness-tomcat

    ports:
      - "8080:8080"

    volumes:
      - ./deploy:/usr/local/tomcat/webapps

    depends_on:
      - mysql

volumes:
  mysql_data:
